<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Agent</title>
  <desc id="desc">A purple and cyan Hermes wing mark with an H monogram.</desc>
